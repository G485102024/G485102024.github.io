<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に指定 -->
  <meta charset="UTF-8">
  <!-- スマートフォンで正しい大きさで表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宮澤環のポートフォリオ</title>

  <style>
    /* ===== 色の設定（ここを変えるとサイト全体の色が変わる） ===== */
    :root {
      --pink: #ff5fa2;     /* ピンク */
      --yellow: #ffd93d;   /* 黄色 */
      --blue: #3ec6ff;     /* 水色 */
      --green: #5be3a4;    /* 緑 */
      --purple: #9b6bff;   /* 紫 */
      --ink: #3a2e4f;      /* 文字の色 */
      --paper: #fffaf0;    /* 背景の色 */
    }

    /* ===== 全体の基本設定 ===== */
    * {
      box-sizing: border-box; /* 余白を含めてサイズを計算する */
    }

    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--ink);
      line-height: 1.8;
      background-color: var(--paper);
      /* 水玉もようの背景 */
      background-image: radial-gradient(var(--yellow) 2px, transparent 2px);
      background-size: 28px 28px;
    }

    /* ===== ページ上部のヘッダー（タイトル部分） ===== */
    header {
      text-align: center;
      padding: 64px 20px 72px;
      color: #fff;
      /* 虹色のグラデーション背景 */
      background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
      /* 下側をなみ形に近いまるみにする */
      border-bottom-left-radius: 50% 28px;
      border-bottom-right-radius: 50% 28px;
    }

    /* 小さな見出し文字（PORTFOLIO） */
    .label {
      display: inline-block;
      margin: 0 0 12px;
      padding: 2px 16px;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      color: var(--ink);
      background: var(--yellow);
      border-radius: 999px;
    }

    /* 名前（いちばん大きい見出し） */
    header h1 {
      margin: 8px 0 12px;
      font-size: clamp(2rem, 8vw, 3.2rem); /* 画面幅に合わせて大きさが変わる */
      text-shadow: 3px 3px 0 rgba(58, 46, 79, 0.3);
    }

    /* 名前の下の学年・所属の文章 */
    header p {
      margin: 0;
      font-size: 1.05rem;
    }

    /* ===== メイン部分の幅の設定 ===== */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    /* ===== 各セクション（カードのような箱） ===== */
    section {
      margin-bottom: 32px;
      padding: 24px 22px;
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 24px;
      box-shadow: 8px 8px 0 var(--ink); /* ポップなかげ */
    }

    /* セクションごとに、かげの色を変えてカラフルにする */
    section:nth-of-type(1) { box-shadow: 8px 8px 0 var(--pink); }
    section:nth-of-type(2) { box-shadow: 8px 8px 0 var(--blue); }
    section:nth-of-type(3) { box-shadow: 8px 8px 0 var(--green); }

    /* セクションの見出し */
    h2 {
      display: inline-block;
      margin: 0 0 16px;
      padding: 4px 18px;
      font-size: 1.25rem;
      color: #fff;
      background: var(--purple);
      border-radius: 999px;
      transform: rotate(-2deg); /* 少しかたむけてポップに */
    }

    /* 見出しの色もセクションごとに変える */
    section:nth-of-type(1) h2 { background: var(--pink); }
    section:nth-of-type(2) h2 { background: var(--blue); }
    section:nth-of-type(3) h2 { background: var(--green); }

    /* ===== 基本情報の表 ===== */
    dl {
      margin: 0;
      display: grid;
      grid-template-columns: 6em 1fr; /* 左：項目名／右：内容 */
      gap: 10px 12px;
    }

    dt {
      font-weight: bold;
      text-align: center;
      background: var(--yellow);
      border-radius: 999px;
    }

    dd {
      margin: 0;
    }

    /* ===== 趣味のリスト ===== */
    ul {
      margin: 0;
      padding: 0;
      list-style: none; /* 標準の黒丸を消す */
    }

    /* 趣味の項目をカラフルなタグ風にする */
    .hobby li {
      display: inline-block;
      margin: 4px 6px 4px 0;
      padding: 6px 18px;
      font-weight: bold;
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--yellow);
    }
    .hobby li:nth-child(2) { background: var(--blue); }
    .hobby li:nth-child(3) { background: var(--pink); color: #fff; }

    /* ===== プログラミング経験のタグ ===== */
    .skill {
      display: inline-block;
      padding: 6px 20px;
      font-weight: bold;
      color: #fff;
      background: var(--purple);
      border: 3px solid var(--ink);
      border-radius: 12px;
    }

    /* ===== ページ下部のフッター ===== */
    footer {
      padding: 24px 16px 32px;
      text-align: center;
      font-size: 0.85rem;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--purple), var(--pink));
    }

    /* ===== スマートフォン向けの調整（画面幅480px以下） ===== */
    @media (max-width: 480px) {
      header {
        padding: 48px 16px 56px;
      }
      section {
        padding: 20px 16px;
        box-shadow: 5px 5px 0 var(--ink);
      }
      section:nth-of-type(1) { box-shadow: 5px 5px 0 var(--pink); }
      section:nth-of-type(2) { box-shadow: 5px 5px 0 var(--blue); }
      section:nth-of-type(3) { box-shadow: 5px 5px 0 var(--green); }
      dl {
        grid-template-columns: 5.5em 1fr; /* 項目名の幅をせまくする */
      }
    }
  </style>
</head>

<body>
  <!-- ===== ヘッダー：名前と学年・所属 ===== -->
  <header>
    <p class="label">PORTFOLIO</p>
    <h1>宮澤環</h1>
    <p>工学部 3年</p>
  </header>

  <main>
    <!-- ===== 基本情報セクション ===== -->
    <section>
      <h2>基本情報</h2>
      <dl>
        <dt>名前</dt>
        <dd>宮澤環</dd>
        <dt>学年</dt>
        <dd>3年</dd>
        <dt>所属</dt>
        <dd>工学部</dd>
      </dl>
    </section>

    <!-- ===== 趣味・好きなことセクション ===== -->
    <section>
      <h2>趣味・好きなこと</h2>
      <ul class="hobby">
        <li>音楽を聴くこと</li>
        <li>ライブに行くこと</li>
        <li>映画を見ること</li>
      </ul>
    </section>

    <!-- ===== プログラミング経験セクション ===== -->
    <section>
      <h2>プログラミング経験</h2>
      <span class="skill">Java</span>
    </section>
  </main>

  <!-- ===== フッター ===== -->
  <footer>
    <p>&copy; 宮澤環 Portfolio</p>
  </footer>
</body>
</html>
